<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AU Help AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, #26324a 0%, #0b0e14 38%, #050608 75%);
      color: white;
      overflow-x: hidden;
    }

    /* NAVBAR */

    nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      opacity: 0.45;
      font-weight: 500;
    }

    .menu {
      display: flex;
      gap: 10px;
    }

    .menu button {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: white;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    /* HERO */

    .hero {
      min-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .ai-orb {
      width: 190px;
      height: 190px;
      border-radius: 50%;

      background:
        radial-gradient(circle at 35% 30%, #ffffff 0%, #9aa8bd 8%, #45546a 25%, #151b26 60%, #07090d 100%);

      box-shadow:
        0 0 40px rgba(160,180,210,0.25),
        inset 15px 15px 35px rgba(255,255,255,0.12),
        inset -20px -20px 40px rgba(0,0,0,0.8);

      animation: float 4s ease-in-out infinite;

      position: relative;
      margin-bottom: 45px;
    }

    .ai-orb::before,
    .ai-orb::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .ai-orb::before {
      inset: -18px;
      animation: rotate 12s linear infinite;
    }

    .ai-orb::after {
      inset: -35px;
      border-style: dashed;
      opacity: 0.45;
      animation: rotateReverse 18s linear infinite;
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateReverse {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    h1 {
      font-size: clamp(42px, 9vw, 82px);
      letter-spacing: -4px;
      line-height: 0.95;
      margin-bottom: 18px;
    }

    .subtitle {
      max-width: 600px;
      color: rgba(255,255,255,0.55);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    /* SEARCH */

    .search-box {
      width: min(700px, 94vw);
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 7px;

      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 22px;

      backdrop-filter: blur(20px);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.35);
    }

    .search-box input {
      flex: 1;
      min-width: 0;

      background: transparent;
      border: none;
      outline: none;

      color: white;
      font-size: 15px;
      padding: 15px;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    .ask-btn {
      border: none;
      background: white;
      color: black;

      padding: 13px 21px;
      border-radius: 16px;

      font-weight: 700;
      cursor: pointer;

      transition: 0.2s;
    }

    .ask-btn:hover {
      transform: scale(1.04);
    }

    /* QUICK ACTIONS */

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;

      margin-top: 25px;
    }

    .quick-actions button {
      padding: 10px 16px;
      border-radius: 18px;

      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.045);

      border: 1px solid rgba(255,255,255,0.09);

      cursor: pointer;
      transition: 0.2s;
    }

    .quick-actions button:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      nav {
        padding: 0 16px;
      }

      .menu button {
        padding: 8px 11px;
        font-size: 12px;
      }

      .ai-orb {
        width: 145px;
        height: 145px;
      }

      h1 {
        letter-spacing: -2.5px;
      }

      .subtitle {
        font-size: 14px;
      }

      .search-box {
        border-radius: 18px;
      }

      .ask-btn {
        padding: 12px 16px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">
      AU Help <span>AI</span>
    </div>

    <div class="menu">
      <button>Explore</button>
      <button>About</button>
    </div>
  </nav>


  <main class="hero">

    <div class="ai-orb"></div>

    <h1>
      Meet AU Help AI
    </h1>

    <p class="subtitle">
      Your intelligent companion for Annamalai University.
      Ask about students, departments, staff, courses, notices,
      results and university information.
    </p>


    <div class="search-box">

      <input
        type="text"
        placeholder="Ask anything about Annamalai University..."
      >

      <button class="ask-btn">
        Ask AI
      </button>

    </div>


    <div class="quick-actions">

      <button>🎓 Student Search</button>

      <button>🏫 Departments</button>

      <button>👨‍🏫 Staff & HOD</button>

      <button>📝 Results</button>

      <button>📢 Notices</button>

      <button>💼 Placements</button>

    </div>

  </main>

</body>
        </html>
