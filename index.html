<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AU Help AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navigation -->
  <nav>
    <div class="logo">
      AU Help <span>AI</span>
    </div>

    <div class="menu">
      <button type="button">Explore</button>
      <button type="button">About</button>
    </div>
  </nav>


  <!-- Main Hero -->
  <main class="hero">

    <!-- AI 3D-style Core -->
    <div class="ai-orb" aria-label="AU Help AI"></div>

    <h1>Meet AU Help AI</h1>

    <p class="subtitle">
      Your intelligent companion for Annamalai University.
      Ask about students, departments, staff, courses,
      notices, results and university information.
    </p>


    <!-- AI Search -->
    <form class="search-box" id="aiSearchForm">

      <input
        id="aiInput"
        type="text"
        placeholder="Ask anything about Annamalai University..."
        autocomplete="off"
      >

      <button class="ask-btn" type="submit">
        Ask AI
      </button>

    </form>


    <!-- Quick Actions -->
    <div class="quick-actions">

      <button type="button" data-query="Find student details">
        🎓 Student Search
      </button>

      <button type="button" data-query="Show AU departments">
        🏫 Departments
      </button>

      <button type="button" data-query="Show AU staff and HOD details">
        👨‍🏫 Staff & HOD
      </button>

      <button type="button" data-query="Check AU results">
        📝 Results
      </button>

      <button type="button" data-query="Show latest AU notices">
        📢 Notices
      </button>

      <button type="button" data-query="Show AU placement information">
        💼 Placements
      </button>

    </div>


    <!-- AI Response -->
    <section class="ai-response" id="aiResponse">

      <div class="response-header">
        <span class="status-dot"></span>
        <span>AU Help AI</span>
      </div>

      <p id="responseText">
        Ask me anything about Annamalai University.
      </p>

    </section>

  </main>


  <!-- JavaScript -->
  <script src="app.js"></script>

</body>
</html>
